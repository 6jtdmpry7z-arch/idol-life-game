function lookControls(v,prefix){

function init(name,look){s={look:lookOf(look),name:name||'アイドル候補生',week:0,money:0,mental:rand(50,100),pop:0,stats:{face:rand(50,800),charm:rand(100,500),dance:100,sing:rand(100,500),humor:rand(100,500)},groups:defs.map(([name,orig,schedule])=>({name,orig,rank:orig,schedule,pop:R[orig].initial,deadUntil:null,fullBonus:false,highest:orig})),current:null,history:[],firstDebut:false,scandal:0,scandalKind:'romance',ban:0,pending:[],exposures:0,romanceExposures:0,apologized:[],partner:null,datingWeeks:0,actionUsed:false,done:false,result:'',surgeryCount:0,offers:[],scout:null,events:[],sEvents:{},logs:[]};for(let i=0;i<5;i++)s.sEvents[i]=rand(0,47);log('テレビで輝くアイドルを見て、アイドルになる夢を抱いた！');save();render()}
function groupAlive(g){return g.deadUntil===null}function skillAvg(){return Object.values(s.stats).reduce((a,b)=>a+b,0)/5}function addMental(v){s.mental=clamp(s.mental+v,0,100);if(s.mental<=0)finish('mental')}

function historyPanel(){return `<div class="panel"><h2>📖 アイドル活動履歴</h2>${s.history.length?s.history.map((h,i)=>`<div class="group"><strong>${i+1}. ${esc(h.name)}</strong><div class="muted">加入：${h.start}歳（通算${h.startWeek}週） ／ 脱退：${h.end===null?'現在所属中':h.end+'歳（通算'+h.endWeek+'週）'} ／ 理由：${esc(h.reason||'活動中')}</div></div>`).join(''):'<p class="muted">まだ所属履歴がありません。</p>'}</div><div class="panel"><h2>📰 活動の記録</h2>${s.logs.slice(0,35).map(x=>`<div class="log">${esc(x)}</div>`).join('')}</div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!s){$('app').innerHTML=`<div class="panel"><h2>🌟 新しいアイドル人生を始めよう！</h2><p>12歳の少女として、トップアイドルを目指そう。</p><div class="idol-stage" id="create-preview">${avatar(LOOK_DEFAULT)}<span class="idol-tag">MY IDOL</span><span class="idol-caption">あなただけのアイドルを作ろう ♡</span></div><label>主人公の名前<input id="name" placeholder="例：星野 ひかり" maxlength="25"></label>${lookControls(LOOK_DEFAULT,'create')}<p class="look-note">あとから「着せ替え」メニューで何度でも変更できます。</p>${btn('この子でゲームスタート ♡','startNew()','primary wide')}${localStorage.getItem(KEY)?`<p>${btn('前回の続きから遊ぶ','load()','wide')}</p>`:''}</div>`;return}if(s.done){$('app').innerHTML=headerStats()+`<div class="panel end"><h2>🏆 アイドル人生の結末</h2><h1>${s.result==='夢は叶わなかった。来世に期待'?'引退':rankGrade()+'ランク'}</h1><p>${esc(s.result)}</p><p>最終個人人気：${fmt(s.pop)} / 1000</p><p class="muted">所属履歴はこの下に表示しています。</p><p>${btn('新しい人生を始める','resetGame()','primary wide')}</p></div>`+historyPanel();return}if(queue.length){let q=queue[0];$('app').innerHTML=headerStats()+`<div class="panel"><h2>${esc(q.title)}</h2><p>${esc(q.desc)}</p><div class="choices">${q.options.map(([label],i)=>btn(esc(label),`dismiss(${i})`,i===0?'primary':'')).join('')}</div></div>`;return}$('app').innerHTML=headerStats()+(notice?`<div class="alert">${esc(notice)}</div>`:'')+`<div class="tabs">${[['home','🏠 ホーム'],['aud',auditionOpenNames().length?'🎟️ オーディション 🔴':'🎟️ オーディション'],['groups','🏢 グループ'],['history','📖 履歴'],['look','🎀 着せ替え']].map(([id,name])=>btn(name,`tab='${id}';render()`,tab===id?'active':'')).join('')}</div>`+({home:home,aud:auditionPanel,groups:groupsPanel,history:historyPanel,look:wardrobe}[tab]())+`<div class="panel"><details><summary>💾 セーブ・やり直し</summary><p class="muted">毎回自動保存されます。同じブラウザで続きから遊べます。</p>${btn('最初からやり直す','resetGame()')}</details></div>`}
function resetGame(){if(confirm('現在のセーブデータを消して最初から始めますか？')){localStorage.removeItem(KEY);s=null;queue=[];tab='home';render()}}function load(){try{s=JSON.parse(localStorage.getItem(KEY));if(!s||!s.groups)throw Error();queue=[];render()}catch(e){alert('セーブデータを読み込めませんでした')}}
document.addEventListener('click',function(event){
 const button=event.target.closest('button[data-aud-type]');
 if(!button)return;
 event.preventDefault();
 audType(button.getAttribute('data-aud-type'));
});
render();</script></body></html>
