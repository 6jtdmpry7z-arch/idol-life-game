<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>アイドル人生シミュレーション</title><style>
:root{--pink:#e94391;--bg:#fff5fa;--ink:#35243b;--muted:#857787}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#ffe2f1,#f8f3ff 55%,#fff8e8);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:760px;margin:auto;padding:15px 12px 90px}header{background:linear-gradient(125deg,#ff5da7,#a36bdf);color:white;padding:22px;border-radius:22px;box-shadow:0 8px 28px #a54c8b33}h1{font-size:24px;margin:0 0 6px}h2{font-size:17px;margin:0 0 12px}p{line-height:1.6}.sub{font-size:12px;opacity:.9}.panel{background:#fff;border:1px solid #f5d6e5;border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 4px 15px #ba6e9520}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#fff5fa;padding:10px;border-radius:12px;font-size:12px}.stat strong{display:block;font-size:18px;margin-top:4px}.bar{height:7px;background:#f3e3ed;border-radius:8px;overflow:hidden;margin-top:6px}.bar>i{display:block;background:linear-gradient(90deg,#ff7cb8,#a77afa);height:100%}button,select,input{font:inherit}button{border:0;background:#fbe4f0;color:#8a2861;border-radius:12px;padding:12px 10px;font-weight:700;cursor:pointer;min-height:44px}button.primary{background:linear-gradient(110deg,#f64c9c,#b268dd);color:white}button:disabled{opacity:.38;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.actions button{text-align:left;font-size:13px}.actions small{display:block;font-weight:400;font-size:11px;margin-top:4px}.pill{display:inline-block;background:#ffe1ee;color:#a32e6e;padding:4px 9px;border-radius:99px;font-size:12px;margin:3px}.muted{color:var(--muted);font-size:12px}.log{border-bottom:1px solid #f2e7ed;padding:8px 0;font-size:13px;line-height:1.5}.log:first-child{font-weight:700}.choices{display:grid;gap:8px}.choices button{text-align:left}.group{border-bottom:1px solid #f2e7ed;padding:10px 0;font-size:13px}.group:last-child{border:0}input{border:1px solid #ebc6d9;border-radius:12px;padding:12px;width:100%;margin:6px 0 12px}details{margin-top:12px}summary{cursor:pointer;font-weight:700}.hidden{display:none}.alert{background:#fff0e4;border:1px solid #f8d4a3;padding:12px;border-radius:12px;margin:10px 0;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;font-size:12px}.tabs button.active{background:#e94391;color:white}.end{background:#fdf0ff;border-radius:14px;padding:18px;text-align:center}.wide{width:100%}
</style></head><body><main><header><h1>🎀 アイドル人生</h1><div>12歳から始まる、あなただけのアイドル物語</div><div class="sub">スマホ対応・1週間ずつ進む人生シミュレーション</div></header><div id="app"></div></main><script>
'use strict';const KEY='idol_life_save_v1';const R={C:{base:1,pay:1000,initial:100,mental:5},B:{base:2,pay:3000,initial:300,mental:10},A:{base:3,pay:10000,initial:600,mental:15},S:{base:5,pay:30000,initial:900,mental:25}};
const defs=[['SHIBUYA GIRLS','C','monthly'],['愛情過剰摂取','B','half'],['きゅるりと未完成','A','year'],['乃木坂46','S','saka'],['櫻坂46','S','saka'],['日向坂46','S','saka'],['AKB48','S','forty'],['NMB48','S','forty'],['＝LOVE','S','sashi'],['≠ME','S','sashi'],['≒JOY','S','sashi'],['FRUITS ZIPPER','S','kawaii'],['CANDY TUNE','S','kawaii'],['CUTIE STREET','S','kawaii']];
let s=null,tab='home',queue=[],notice='';const $=x=>document.getElementById(x),rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,clamp=(x,a=0,b=1000)=>Math.max(a,Math.min(b,x)),fmt=n=>Math.floor(n).toLocaleString('ja-JP'),age=()=>12+Math.floor(s.week/48),yr=()=>Math.floor(s.week/48),month=()=>Math.floor(s.week%48/4)+1,wim=()=>s.week%4+1,group=()=>s.groups.find(g=>g.name===s.current),isIdol=()=>!!s.current;
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function log(t){s.logs.unshift(`【${age()}歳 ${month()}月・${wim()}週】${t}`);s.logs=s.logs.slice(0,120)}
function init(name){s={name:name||'アイドル候補生',week:0,money:0,mental:rand(50,100),pop:0,stats:{face:rand(100,500),charm:rand(100,500),dance:100,sing:rand(100,500),humor:rand(100,500)},groups:defs.map(([name,orig,schedule])=>({name,orig,rank:orig,schedule,pop:R[orig].initial,deadUntil:null,fullBonus:false,highest:orig})),current:null,history:[],firstDebut:false,scandal:0,scandalKind:'romance',ban:0,pending:[],exposures:0,romanceExposures:0,apologized:[],partner:null,datingWeeks:0,actionUsed:false,done:false,result:'',surgeryCount:0,offers:[],scout:null,events:[],sEvents:{},logs:[]};for(let i=0;i<5;i++)s.sEvents[i]=rand(0,47);log('テレビで輝くアイドルを見て、アイドルになる夢を抱いた！');save();render()}
function groupAlive(g){return g.deadUntil===null}function skillAvg(){return Object.values(s.stats).reduce((a,b)=>a+b,0)/5}function addMental(v){s.mental=clamp(s.mental+v,0,100);if(s.mental<=0)finish('mental')}
function closeHistory(reason){const h=s.history.at(-1);if(h&&!h.end){h.end=age();h.endWeek=s.week;h.reason=reason}}
function join(g){if(s.ban>0){if(!s.pending.includes(g.name))s.pending.push(g.name);log(`${g.name}の合格資格を保留した（移籍禁止中）`);return}const old=group();if(old&&old.name===g.name)return;const wasIdol=!!old;if(old)closeHistory('移籍');if(wasIdol){s.pop=clamp(s.pop*.8);const diff=['C','B','A','S'].indexOf(g.rank)-['C','B','A','S'].indexOf(old.rank);addMental(diff>0?10:diff<0?-10:0)}else if(!s.firstDebut){addMental(R[g.rank].mental);s.firstDebut=true}g.pop=R[g.rank].initial;s.current=g.name;s.history.push({name:g.name,start:age(),startWeek:s.week,end:null,reason:null});log(`${g.name}へ${wasIdol?'移籍':'加入'}！ ランク${g.rank}`);s.pending=[];save()}
function graduate(){if(!isIdol())return;closeHistory('卒業');log(`${s.current}を卒業した。一般人として新しい道へ。`);s.current=null;s.partner=null;s.datingWeeks=0;s.scandal=0;queue.push({title:'🎓 グループを卒業しました',desc:'ここで人生の結果を見るか、一般人として再デビューを目指すか選べます。',options:[['結果を見て終了',()=>finish('graduate')],['一般人として続ける',()=>{}]]});save();render()}
function disband(g){g.deadUntil=s.week+48;g.pop=0;log(`速報！ ${g.name}が解散した！`);if(s.current===g.name){closeHistory('グループ解散');s.current=null;s.partner=null;s.datingWeeks=0;s.scandal=0;addMental(-10);queue.push({title:'💔 グループ解散',desc:`${g.name}が解散。一般人に戻りました。メンタル−10。`,options:[['確認',()=>{}]]})}}
function promotion(g){if(g.rank==='C'&&g.pop>=300){g.rank='B';addMental(5);log(`${g.name}がBランクに昇格！ メンタル＋5`)}else if(g.rank==='B'&&g.pop>=500){g.rank='A';addMental(10);log(`${g.name}がAランクに昇格！ メンタル＋10`)}else if(g.rank==='A'&&g.pop>=800){g.rank='S';addMental(20);log(`${g.name}がSランクに昇格！ メンタル＋20`)}}
function finish(reason){if(s.done)return;s.done=true;let text='';if(reason==='mental'||reason==='age25')text='夢は叶わなかった。来世に期待';else{const p=s.pop;text=p<=400?'トップアイドルの足元にも及ばなかった':p<=600?'アイドルとトップアイドルの壁を痛感した':p<=700?'トップアイドルにはなれなかったが満足した':p<=900?'あと少しでトップアイドルだった、アイドル人生を全うした':p<1000?'正真正銘のトップアイドル、オタク達は貴方のことを忘れない':'歴史に名を残す超トップアイドル、死んでも語り継がれるだろう'}if(isIdol())closeHistory('引退');s.result=text;log('アイドル人生が幕を閉じた。');queue=[];save()}
function rankGrade(){return s.pop<=400?'D':s.pop<=600?'C':s.pop<=700?'B':s.pop<=900?'A':s.pop<1000?'S':'SS'}
function applyScandal(kind){s.exposures++;s.scandal=Math.max(0,s.scandal-50);s.ban=4;let p=kind==='romance'?50:kind==='surgery'?100:150,m=kind==='romance'?10:kind==='surgery'?20:30,g=kind==='romance'?25:kind==='surgery'?50:75;s.pop=clamp(s.pop-p);addMental(-m);if(group()){group().pop=Math.max(0,group().pop-g);if(group().pop===0)disband(group())}let headline=kind==='romance'?(++s.romanceExposures===1?'熱愛発覚':s.romanceExposures===2?'再び熱愛報道':'度重なる熱愛報道'):kind==='surgery'?'整形報道':'事務所の不適切な要求が報道';log(`📰 ${headline}！ 個人人気−${p}、メンタル−${m}、グループ人気−${g}。移籍禁止4週間。`);if(s.done)return;if(kind==='romance'&&s.partner){const key=s.partner.id;if(!s.apologized.includes(key))queue.push({title:'📰 熱愛報道への対応',desc:'ファンへ謝罪する？（成功50%：人気＋20／失敗50%：人気−10）',options:[['謝罪する',()=>{s.apologized.push(key);let ok=Math.random()<.5;s.pop=clamp(s.pop+(ok?20:-10));log(ok?'謝罪が受け入れられた。個人人気＋20':'謝罪は受け入れられなかった。個人人気−10')}],['謝罪しない',()=>{}]]});queue.push({title:'💌 交際を続ける？',desc:'報道後も交際を続けることができます。',options:[['交際を続ける',()=>{}],['別れる',()=>breakup()]]})}if(!s.done)queue.push({title:'⚠️ スキャンダル報道',desc:`${headline}。移籍・再デビューは4週間禁止。オーディション受験と合格資格の保留は可能です。`,options:[['確認',()=>{}]]})}
function breakup(){if(!s.partner)return;log(`${s.partner.name}と別れた。`);s.partner=null;s.datingWeeks=0}
function eligible(g){if(!groupAlive(g))return false;const a=age(),f=s.stats.face,d=s.stats.dance,v=s.stats.sing;if(g.orig==='C')return f>=100;if(g.orig==='B')return f>=200&&Math.max(d,v)>=400;if(g.orig==='A')return f>=300&&Math.max(d,v)>=500;return f>=500}
function available(g){if(!groupAlive(g)||s.current===g.name||s.pending.includes(g.name))return false;const t=g.schedule;if(t==='monthly')return s.week%4===0;if(t==='half')return s.week%24===0;if(t==='year')return s.week%48===0;if(t==='saka')return [12,16,20].includes(age())&&s.week%48===s.sEvents[0];if(t==='forty')return age()>=12&&age()<=19&&s.week%48===s.sEvents[1];if(t==='sashi')return [13,15,17,19].includes(age())&&s.week%48===s.sEvents[2];if(t==='kawaii')return [14,18].includes(age())&&s.week%48===s.sEvents[3];return false}
function aud(g,special=false){
 if(s.done||!g||!groupAlive(g))return;
 if(s.pending.includes(g.name)){notice='このグループの合格資格はすでに保留中です。';render();return}
 if(s.current===g.name){notice='現在所属しているグループです。';render();return}
 if(!available(g)&&g.specialWeek!==s.week){notice='このグループのオーディションは今週開催されていません。';render();return}
 const expensive=['A','S'].includes(g.orig);
 if(expensive&&s.actionUsed){notice='今週の自由行動は使用済みです。翌週以降に挑戦してね。';render();return}
 if(expensive)s.actionUsed=true;
 // 受験資格なし。審査の内部基準は公開しない。
 const f=s.stats.face,d=s.stats.dance,v=s.stats.sing;
 let passed=g.orig==='C'?f>=100:g.orig==='B'?f>=200&&Math.max(d,v)>=400:g.orig==='A'?f>=300&&Math.max(d,v)>=500:f>=600&&Math.max(d,v)>=400;
 if(!passed){addMental(-5);log(`${g.name}のオーディションに不合格。メンタル−5`);queue.push({title:'📩 オーディション結果：不合格',desc:`${g.name}の審査に落選しました。メンタル−5。能力を磨いてまた挑戦しよう！`,options:[['確認する',()=>{}]]});save();render();return}
 log(`${g.name}のオーディションに合格！`);
 if(s.ban>0){if(!s.pending.includes(g.name))s.pending.push(g.name);queue.push({title:'🎉 オーディション結果：合格！',desc:`${g.name}に合格！ ただし移籍・再デビュー禁止期間中のため、合格資格を保留しました。`,options:[['確認する',()=>{}]]});save();render();return}
 queue.push({title:`🎉 ${g.name} 合格！`,desc:s.current?'現在のグループから移籍しますか？':'アイドルデビューしますか？',options:[[s.current?'移籍する':'加入する',()=>join(g)],['辞退する',()=>log(`${g.name}への加入を辞退した`)]]});save();render();
}
function doAction(id){if(s.done||s.actionUsed)return;const st=s.stats;if(id==='dance'){st.dance=clamp(st.dance+5);log('ダンスレッスン！ ダンス＋5')}else if(id==='sing'){st.sing=clamp(st.sing+5);log('ボーカルレッスン！ 歌唱力＋5')}else if(id==='humor'){st.humor=clamp(st.humor+5);log('バラエティ番組を研究！ ユーモア＋5')}else if(id==='charm'){st.charm=clamp(st.charm+5);log('笑顔の練習！ 愛嬌＋5')}else if(id==='town'){const cost=rand(1000,5000);if(s.money<5000){notice='街へ出かけるには5,000円以上必要です（費用は1,000〜5,000円）';render();return}s.money-=cost;st.face=clamp(st.face+1);log(`街へお出かけ。${fmt(cost)}円を使い、顔面偏差値＋1`);let chance=st.face>=900?.2:st.face>=700?.1:st.face>=500?.05:st.face>=300?.02:0;if(Math.max(st.dance,st.sing)>=500&&Math.random()<chance){queue.push({title:'✨ スカウトされた！',desc:'「きゅるりと未完成」のスタッフから声をかけられた！',options:[['スカウトを受ける',()=>{let g=s.groups.find(g=>g.name==='きゅるりと未完成');if(s.ban>0){if(!s.pending.includes(g.name))s.pending.push(g.name);log('スカウト加入資格を保留した')}else join(g)}],['断る',()=>log('スカウトを断った')]]})}}else if(id==='help'){s.money+=1000;log('親のお手伝いで1,000円をもらった')}else if(id==='job'){const v=rand(5000,10000);s.money+=v;log(`アルバイトで${fmt(v)}円を稼いだ`)}else if(id==='surgery'){if(s.money<300000){notice='整形には30万円必要です';render();return}s.money-=300000;s.surgeryCount++;let bad=s.surgeryCount>=4&&Math.random()<.5;st.face=clamp(st.face+(bad?-50:100));addMental(-10);s.scandal=clamp(s.scandal+10,0,100);s.scandalKind='surgery';log(`美容整形。顔面偏差値${bad?'−50':'＋100'}、メンタル−10、スキャンダル＋10`)}s.actionUsed=true;save();render()}
function advance(){if(s.done||queue.length)return;notice='';// start of week check before other changes
s.week++;s.actionUsed=false;for(const g of s.groups){if(g.deadUntil!==null&&s.week>=g.deadUntil){g.deadUntil=null;g.rank=g.orig;g.pop=R[g.orig].initial;log(`📰 速報！「${g.name}」が活動再開を発表！`);queue.push({title:'📰 活動再開ニュース',desc:`「${g.name}」が活動再開！ 今週、特別オーディションが開催されます。`,options:[['確認',()=>{}]]});g.specialWeek=s.week}}
if(s.ban>0){s.ban--;if(s.ban===0){let names=[...s.pending];queue.push({title:'🔓 移籍禁止期間が終了しました！',desc:names.length?'保留していた合格資格から加入先を1つ選ぶか、現在の所属を続けられます。':'移籍・再デビューが再び可能になりました。',options:[...names.filter(n=>s.groups.some(g=>g.name===n&&groupAlive(g))).map(n=>[`${n}へ加入`,()=>{const g=s.groups.find(g=>g.name===n);join(g);s.pending=[]}]),['今の状態を続ける',()=>{s.pending=[]}]]})}}
if(isIdol()&&s.scandal>50){let p=s.scandal<=60?.01:s.scandal<90?.05:.10;if(Math.random()<p)applyScandal(s.scandalKind)}if(s.done){render();return}
if(s.week%48===0){s.stats.face=clamp(s.stats.face+(age()<=20?10:0));if(age()<=20)log('お誕生日！ 顔面偏差値＋10')}
if(isIdol()){let g=group();let inc=R[g.rank].base*(1+skillAvg()/1000);s.pop=clamp(s.pop+inc);let pay=R[g.rank].pay*(1+s.pop/500);s.money+=Math.floor(pay);g.pop=clamp(g.pop+R[g.rank].base*(1+s.pop/1000));promotion(g);if(g.pop>=1000&&!g.fullBonus){g.fullBonus=true;s.pop=clamp(s.pop+100);log(`${g.name}が人気1000を達成！ 個人人気＋100`)}let x=Math.random();if(x<.1){addMental(10);log('握手会が大盛況！ メンタル＋10')}else if(x<.2){addMental(5);log('ライブが大成功！ メンタル＋5')}else if(x<.25)log('テレビ出演で注目を集めた！');if(s.partner){s.datingWeeks++;addMental(1);s.scandal=clamp(s.scandal+1,0,100);s.scandalKind='romance';if(s.datingWeeks%48===0){addMental(10);log('交際48週間の記念日！ メンタル＋10')}}else if(age()>=16&&Math.random()<.05){let first=['佐藤','田中','高橋','山本','伊藤','中村','小林','加藤'],last=['悠真','蓮','大翔','颯太','湊','樹','陽翔'];let person={id:s.week+'-'+rand(100,999),name:first[rand(0,7)]+' '+last[rand(0,6)],startAge:age()+rand(-2,2)};queue.push({title:'💌 男性アイドルからの告白',desc:`${person.name}（${person.startAge}歳）から交際を申し込まれた！`,options:[['交際する',()=>{s.partner=person;s.datingWeeks=0;log(`${person.name}と交際を始めた！`)}],['断る',()=>log('交際を断った')]]})}}else{if(s.firstDebut)s.pop=clamp(s.pop-1);if(s.scandal>0)s.scandal--;if(!s.firstDebut&&age()>=25)finish('age25')}
if(isIdol()&&!s.partner&&s.scandal>0)s.scandal--;
if(age()>=30)finish('age30');save();render()}
function dismiss(i){let e=queue.shift();if(e&&e.options[i])e.options[i][1]();save();render()}
function btn(text,fn,cls=''){return `<button class="${esc(cls)}" onclick="${esc(fn)}">${text}</button>`}function bar(v,max=1000){return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,v/max*100))}%"></i></div>`}
function headerStats(){return `<div class="panel"><h2>🌸 ${esc(s.name)} <span class="pill">${age()}歳 ${month()}月 第${wim()}週</span></h2><div class="grid"><div class="stat">所属<strong>${esc(s.current||'一般人')}</strong></div><div class="stat">個人人気<strong>${fmt(s.pop)} / 1000</strong>${bar(s.pop)}</div><div class="stat">メンタル<strong>${fmt(s.mental)} / 100</strong>${bar(s.mental,100)}</div><div class="stat">所持金<strong>¥${fmt(s.money)}</strong></div><div class="stat">スキャンダル<strong>${fmt(s.scandal)} / 100</strong>${bar(s.scandal,100)}</div><div class="stat">現在のグループ人気<strong>${group()?fmt(group().pop)+' / 1000':'―'}</strong>${group()?bar(group().pop):''}</div></div>${s.ban?`<p class="alert">🚫 移籍・再デビュー禁止：残り${s.ban}週間</p>`:''}${s.pending.length?`<p class="muted">保留中の合格資格：${s.pending.map(esc).join('、')}</p>`:''}</div>`}
function home(){return `<div class="panel"><h2>✨ 今週の自由行動</h2><p class="muted">${s.actionUsed?'今週の自由行動は終了しました。':'1週間に1つ選べます。'}</p><div class="actions">${[['dance','💃 ダンスレッスン','ダンス＋5'],['sing','🎤 ボーカルレッスン','歌唱力＋5'],['charm','😊 笑顔の練習','愛嬌＋5'],['humor','📺 バラエティ研究','ユーモア＋5'],['town','🛍️ 街へ出かける','費用1,000〜5,000円／顔面＋1／スカウト'],...(age()<=18?[['help','🏠 親のお手伝い','＋1,000円']]:[]),...(age()>=16?[['job','💼 アルバイト','＋5,000〜10,000円']]:[]),['surgery','💎 美容整形','30万円／顔面＋100（4回目以降リスク）']].map(([id,label,desc])=>`<button ${s.actionUsed?'disabled':''} onclick="doAction('${id}')">${label}<small>${desc}</small></button>`).join('')}</div></div><div class="panel"><h2>📊 能力値</h2>${Object.entries({face:'顔面偏差値',charm:'愛嬌',dance:'ダンス',sing:'歌唱力',humor:'ユーモア'}).map(([k,v])=>`<div class="group">${v} <strong style="float:right">${fmt(s.stats[k])}</strong>${bar(s.stats[k])}</div>`).join('')}</div><div class="panel"><h2>📅 週を進める</h2><p class="muted">週を進めるとアイドル活動、収入、人気成長、イベントが自動処理されます。</p>${btn('次の週へ進む →','advance()','primary wide')}${isIdol()&&s.week%4===3?`<p>${btn('🎓 今月末で卒業する','graduate()')}</p>`:''}${s.partner?`<p>💌 交際中：${esc(s.partner.name)}（交際${s.datingWeeks}週間） ${btn('別れる','breakup();render()')}</p>`:''}</div>`}
function auditionPanel(){
 let gs=s.groups.filter(g=>groupAlive(g)&&g.name!==s.current);
 let open=gs.filter(g=>available(g)||g.specialWeek===s.week);
 return `<div class="panel"><h2>🎟️ オーディション</h2><p class="muted">開催中のオーディションは能力値に関係なく受験可能！ 合格基準は非公開です。C/Bは自由行動を消費せず、A/Sは消費します。</p>${open.map(g=>`<div class="group"><strong>${esc(g.name)}</strong> <span class="pill">${g.rank}ランク</span> ${g.specialWeek===s.week?'<span class="pill">復活特別開催</span>':''}<div class="muted">審査基準：非公開</div><div style="margin-top:8px"><button type="button" class="primary" data-aud-name="${esc(g.name)}">🎤 受験する</button></div></div>`).join('')||'<p>今週受験できるオーディションはありません。</p>'}<details><summary>グループ別オーディション開催周期</summary>${gs.map(g=>`<div class="group">${esc(g.name)}（${g.orig}） <span class="muted">${{monthly:'4週ごと',half:'24週ごと',year:'48週ごと',saka:'12・16・20歳のランダム週',forty:'12〜19歳のランダム週',sashi:'13・15・17・19歳のランダム週',kawaii:'14・18歳のランダム週'}[g.schedule]}</span></div>`).join('')}</details></div>${s.pending.length?`<div class="panel"><h2>📩 保留中の合格資格</h2>${s.pending.map(n=>`<div class="group">${esc(n)} ${btn('辞退する',`decline(${JSON.stringify(n)})`)}</div>`).join('')}</div>`:''}`
}
function decline(n){s.pending=s.pending.filter(x=>x!==n);log(`${n}の合格資格を辞退した`);save();render()}
function groupsPanel(){return `<div class="panel"><h2>🏢 アイドルグループ一覧</h2><p class="muted">解散中のグループは非表示。他グループの人気数値は非表示です。</p>${s.groups.filter(groupAlive).map(g=>`<div class="group"><strong>${esc(g.name)}</strong> <span class="pill">${g.rank}ランク</span>${g.name===s.current?`<div class="muted">所属中／人気${fmt(g.pop)}</div>`:''}</div>`).join('')}</div>`}
function historyPanel(){return `<div class="panel"><h2>📖 アイドル活動履歴</h2>${s.history.length?s.history.map((h,i)=>`<div class="group"><strong>${i+1}. ${esc(h.name)}</strong><div class="muted">加入：${h.start}歳（通算${h.startWeek}週） ／ 脱退：${h.end===null?'現在所属中':h.end+'歳（通算'+h.endWeek+'週）'} ／ 理由：${esc(h.reason||'活動中')}</div></div>`).join(''):'<p class="muted">まだ所属履歴がありません。</p>'}</div><div class="panel"><h2>📰 活動の記録</h2>${s.logs.slice(0,35).map(x=>`<div class="log">${esc(x)}</div>`).join('')}</div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!s){$('app').innerHTML=`<div class="panel"><h2>🌟 新しいアイドル人生を始めよう！</h2><p>12歳の少女として、トップアイドルを目指そう。</p><label>主人公の名前<input id="name" placeholder="例：星野 ひかり" maxlength="25"></label>${btn('ゲームスタート！',`init($('name').value.trim())`,'primary wide')}${localStorage.getItem(KEY)?`<p>${btn('前回の続きから遊ぶ','load()','wide')}</p>`:''}</div>`;return}if(s.done){$('app').innerHTML=headerStats()+`<div class="panel end"><h2>🏆 アイドル人生の結末</h2><h1>${s.result==='夢は叶わなかった。来世に期待'?'引退':rankGrade()+'ランク'}</h1><p>${esc(s.result)}</p><p>最終個人人気：${fmt(s.pop)} / 1000</p><p class="muted">所属履歴はこの下に表示しています。</p><p>${btn('新しい人生を始める','resetGame()','primary wide')}</p></div>`+historyPanel();return}if(queue.length){let q=queue[0];$('app').innerHTML=headerStats()+`<div class="panel"><h2>${esc(q.title)}</h2><p>${esc(q.desc)}</p><div class="choices">${q.options.map(([label],i)=>btn(esc(label),`dismiss(${i})`,i===0?'primary':'')).join('')}</div></div>`;return}$('app').innerHTML=headerStats()+(notice?`<div class="alert">${esc(notice)}</div>`:'')+`<div class="tabs">${[['home','🏠 ホーム'],['aud','🎟️ オーディション'],['groups','🏢 グループ'],['history','📖 履歴']].map(([id,name])=>btn(name,`tab='${id}';render()`,tab===id?'active':'')).join('')}</div>`+({home:home,aud:auditionPanel,groups:groupsPanel,history:historyPanel}[tab]())+`<div class="panel"><details><summary>💾 セーブ・やり直し</summary><p class="muted">毎回自動保存されます。同じブラウザで続きから遊べます。</p>${btn('最初からやり直す','resetGame()')}</details></div>`}
function resetGame(){if(confirm('現在のセーブデータを消して最初から始めますか？')){localStorage.removeItem(KEY);s=null;queue=[];tab='home';render()}}function load(){try{s=JSON.parse(localStorage.getItem(KEY));if(!s||!s.groups)throw Error();queue=[];render()}catch(e){alert('セーブデータを読み込めませんでした')}}
document.addEventListener('click',function(event){
 const button=event.target.closest('button[data-aud-name]');
 if(!button)return;
 event.preventDefault();
 const name=button.getAttribute('data-aud-name');
 const g=s&&s.groups.find(item=>item.name===name);
 if(g)aud(g);
 else {notice='オーディション情報の取得に失敗しました。';render()}
});
render();</script></body></html>
