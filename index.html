/* Idol Life - Royal Kawaii Theme / presentation-only override */
:root{--pink:#ef4c96;--bg:#fff6fb;--ink:#51334d;--muted:#9a7d94;--rose:#ff75ae;--border:#f6d8e6}
html{background:#fff4fa}
body{min-height:100vh;background:
 radial-gradient(circle at 9% 5%,#ffe1f0 0,transparent 32%),
 radial-gradient(circle at 96% 14%,#f5e3ff 0,transparent 35%),
 linear-gradient(180deg,#fff8fc,#fff4f9 55%,#fffaf5);
 color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
 -webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:15px 13px 100px}
header{position:relative;overflow:hidden;text-align:center;
 background:linear-gradient(130deg,#ff8bbd 0%,#f75a9c 53%,#d968ad 100%);
 border:3px solid #fff;border-radius:28px;padding:30px 18px 25px;
 box-shadow:0 12px 30px #d97fa353,0 0 0 1px #f4c5dc}
header:before{content:"✦  ♡  ✧";position:absolute;left:14px;top:12px;color:#fff8;letter-spacing:12px;font-size:16px}
header:after{content:"✧  ♡  ✦";position:absolute;right:0;bottom:9px;color:#fff9;letter-spacing:10px;font-size:16px}
header h1{font-size:clamp(27px,6vw,38px);font-weight:900;letter-spacing:.045em;text-shadow:0 2px 0 #d64383,0 4px 14px #9f3c7c60;margin:0 0 10px}
header>div:not(.sub){font-size:13px;font-weight:700;letter-spacing:.045em}
header .sub{display:inline-block;margin-top:13px;padding:6px 12px;background:#ffffff35;border:1px solid #ffffff70;border-radius:30px;font-size:10px}
.panel{background:#fffdfefa;border:1.5px solid #f6d9e7;border-radius:23px;
 padding:17px;margin:15px 0;box-shadow:0 5px 0 #f8e4ed,0 9px 22px #cc85a51c}
.panel h2{font-size:17px;font-weight:850;letter-spacing:.015em;color:#ba3e7e;margin:0 0 14px}
.panel h2:before{content:"✦";color:#ff9ec5;margin-right:7px;font-size:13px}
.panel p{line-height:1.7}
.grid{gap:10px}
.stat{background:linear-gradient(160deg,#fff5fa,#fffafc);border:1px solid #f8dce9;border-radius:16px;padding:12px 11px;
 font-size:11px;color:#9b718c;min-width:0;overflow-wrap:anywhere}
.stat strong{font-size:clamp(15px,3.7vw,19px);color:#6c345c;font-weight:850;line-height:1.35;margin-top:5px}
.bar{height:8px;background:#f6e6f0;border-radius:20px;margin-top:9px}
.bar>i{background:linear-gradient(90deg,#ff92c0,#ed529e);border-radius:20px}
.pill{background:#fff0f7;border:1px solid #f6cce0;color:#c34c8c;font-weight:750;padding:5px 10px}
button{border:1px solid #f7cfe1;background:linear-gradient(180deg,#fff6fb,#ffe4f0);color:#a93473;
 border-radius:14px;box-shadow:0 3px 0 #f3bfd6;font-weight:800;padding:12px 11px;
 transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;touch-action:manipulation}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #f3bfd6}
button.primary{background:linear-gradient(115deg,#ff6da9,#e94c96 60%,#d64c98);border:1px solid #d94b8e;
 color:white;box-shadow:0 4px 0 #bc367b,0 6px 13px #e96b9a3a}
button.primary:active:not(:disabled){box-shadow:0 1px 0 #bc367b}
button:disabled{opacity:.45;filter:grayscale(.22);box-shadow:none}
.actions{gap:10px}
.actions button{background:linear-gradient(160deg,#fffafd,#ffedf5);border:1px solid #f8d7e5;border-radius:17px;
 min-height:83px;font-size:13px;padding:12px;text-align:left;box-shadow:0 3px 0 #f8dce9}
.actions button small{color:#aa829c;font-size:11px;line-height:1.5;margin-top:7px}
.tabs{position:sticky;top:0;z-index:10;background:#fff6fbea;padding:10px 2px 12px;margin:15px -2px 10px;
 border-radius:18px;gap:7px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabs button{flex:1;min-width:max-content;padding:11px 10px;background:#fff;border:1px solid #f5d5e4;
 border-radius:13px;box-shadow:0 2px 0 #f4d9e7;font-size:12px}
.tabs button.active{background:linear-gradient(135deg,#ff77ad,#ed5198);color:#fff;border-color:#df4a8f;box-shadow:0 3px 0 #c43f83}
.group{padding:14px 2px;border-bottom:1px dashed #f0d4e3;line-height:1.6}
.group strong{color:#8c3e72}
.group button{margin-top:3px}
.log{border-bottom:1px dashed #f0d4e3;padding:12px 3px;line-height:1.65}
.alert{background:#fff2f5;border:1px solid #f8c8d8;color:#ad5274;border-radius:16px;padding:13px}
.muted{color:#a1849a;line-height:1.65}
input{background:#fff9fc;border:1.5px solid #f3cadd;border-radius:14px;outline:none}
input:focus{border-color:#e966a1;box-shadow:0 0 0 3px #ffd9e9}
summary{color:#a74780;padding:7px 0}
.choices{gap:12px}
.choices button{padding:15px}
.end{background:linear-gradient(150deg,#fff5fa,#fff0fa);border:1px solid #f4c5dd}
.end h1{font-size:36px;color:#e64c99}
.wide{min-height:51px}
@media(max-width:380px){main{padding-left:9px;padding-right:9px}.panel{padding:13px}.stat{padding:10px 8px}.tabs button{font-size:11px;padding:10px 8px}.actions button{font-size:12px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

:root{--rose:#ed4c98}
.idol-stage{position:relative;min-height:265px;display:flex;justify-content:center;align-items:center;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 34%,#fffdfb 0 16%,#ffe5f4 38%,#f5d2f0 78%,#e9b5db 100%);border:2px solid white;box-shadow:0 5px 0 #f6d8e8,0 9px 25px #dd9fc547;margin:0 0 16px}
.idol-stage:before{content:"✦     ♡     ✧";position:absolute;top:14px;left:10%;color:#fff;font-size:22px;letter-spacing:17px;text-shadow:0 2px 6px #db69ac}
.idol-stage:after{content:"✧    ✦    ♡";position:absolute;bottom:12px;right:5%;color:#fff;font-size:18px;letter-spacing:15px}
.idol-avatar{width:205px;max-width:70%;height:235px;filter:drop-shadow(0 8px 10px #b9769a66);z-index:1}
.idol-caption{position:absolute;bottom:12px;left:12px;z-index:2;border:1px solid #fff9;border-radius:30px;background:#ffffffd9;padding:6px 13px;font-size:11px;color:#a13b79;font-weight:800}
.idol-tag{position:absolute;top:12px;right:10px;z-index:2;border-radius:20px;background:#e95b9b;color:white;padding:5px 10px;font-size:10px;font-weight:800}
.look-controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:13px 0}
.look-controls label{font-size:12px;font-weight:800;color:#a4487c}
.look-controls select{display:block;width:100%;min-width:0;margin-top:6px;padding:11px 8px;border:1.5px solid #f3cadd;border-radius:13px;background:#fff9fc;color:#713c63;font-size:14px}
.look-controls select:focus{outline:2px solid #f9a3ca}
.look-note{font-size:11px;color:#a48098;line-height:1.6}
#name{display:block;width:100%;box-sizing:border-box;margin:8px 0 15px;padding:12px}
.aud-notification{border:2px solid #f6a6cb;background:linear-gradient(135deg,#fff8fd,#ffe3f0);border-radius:22px;padding:16px;margin:15px 0;box-shadow:0 5px 0 #f9d4e5,0 8px 20px #e899ba3a}
.aud-notification-title{font-weight:900;color:#c63e84;font-size:17px}
.aud-notification p{font-size:13px;line-height:1.6;color:#895875;overflow-wrap:anywhere}
.aud-count{background:#f45a9d;color:white;border-radius:30px;padding:3px 9px;font-size:11px}

/* Ver.1.10 — Premium Idol Home */
body{background:radial-gradient(ellipse at 10% 5%,#ffe1f0 0,transparent 36%),linear-gradient(180deg,#fff8fc 0%,#fceef7 60%,#fffafc 100%)}
main{padding:12px 12px 105px}
header{padding:17px 14px 15px;border-radius:21px;box-shadow:0 5px 17px #d97fa33c}
header h1{font-size:clamp(23px,5vw,29px);margin-bottom:3px}
header .sub{margin-top:8px}
.idol-dashboard{border-radius:25px;background:linear-gradient(145deg,#fff8fd,#fff1f8);border:2px solid #fff;box-shadow:0 9px 27px #d881a444;margin:15px 0;overflow:hidden}
.dashboard-top{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 14px;background:#fffafd;color:#aa4b83;font-size:10px;font-weight:900;letter-spacing:.07em}
.dashboard-date{color:#93647e;letter-spacing:0}
.dashboard-hero{position:relative;min-height:330px;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;background:radial-gradient(circle at 50% 40%,#fff7fb 0,#ffd5e9 42%,#eeacd8 75%,#d58bcb 100%)}
.dashboard-hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(118deg,transparent 0 48px,#fff5 49px 51px,transparent 52px 97px);opacity:.42}
.dashboard-hero:after{content:"";position:absolute;bottom:-80px;width:90%;height:135px;background:#fff7fca6;border-radius:50%;filter:blur(13px)}
.dashboard-hero .idol-avatar{width:255px;height:300px;max-width:85%;position:relative;z-index:2;transform:translateY(10px);filter:drop-shadow(0 10px 14px #ac5a9066)}
.hero-sparkles{position:absolute;top:25px;left:8%;font-size:30px;color:#fff;text-shadow:0 3px 12px #d15da3;letter-spacing:20px;z-index:1}
.hero-label{position:absolute;left:12px;bottom:13px;z-index:3;display:flex;flex-direction:column;gap:3px;max-width:70%;background:#ffffffde;border:1px solid #fff;border-radius:15px;padding:10px 12px;box-shadow:0 3px 12px #a74c8422}
.hero-kicker{font-size:9px;color:#e15599;letter-spacing:.14em;font-weight:900}
.hero-label strong{font-size:18px;color:#7b3466;overflow-wrap:anywhere}
.hero-label>span:last-child{font-size:11px;color:#97617e;overflow-wrap:anywhere}
.hero-rank{position:absolute;right:12px;top:14px;z-index:3;border-radius:25px;padding:7px 11px;color:white;background:linear-gradient(135deg,#f7ad57,#e885ad);border:1px solid #fff9;box-shadow:0 3px 8px #c46a9c55;font-size:10px;font-weight:900;letter-spacing:.07em}
.dashboard-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:13px}
.metric{background:#fff;border:1px solid #f8d6e5;border-radius:16px;padding:12px 11px;min-width:0;box-shadow:0 3px 0 #f7e1eb}
.metric>span{display:block;font-size:11px;color:#aa6b92;font-weight:750}
.metric strong{display:block;color:#793b69;font-size:21px;font-weight:900;margin:4px 0;overflow-wrap:anywhere}
.metric small{font-size:10px;font-weight:700;color:#b58aa1}
.metric .bar{height:7px;margin-top:8px}
.dashboard-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:0 15px 14px;color:#a96e90;font-size:10px;font-weight:800}
.idol-dashboard>.alert,.idol-dashboard>.muted{margin:0 13px 13px}
.weekly-card{margin:16px 0;border:2px solid #fff;border-radius:23px;background:linear-gradient(125deg,#f8a7cb 0%,#f476ae 53%,#e46ba8 100%);padding:19px 17px 20px;color:white;box-shadow:0 7px 0 #f4d3e3,0 12px 24px #d58bb33d;position:relative;overflow:hidden}
.weekly-card:after{content:"✧";position:absolute;right:-4px;top:-24px;color:#ffffff3a;font-size:145px;pointer-events:none}
.weekly-label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.12em;font-weight:900;position:relative;z-index:1}
.weekly-label span{border:1px solid #fff9;padding:3px 7px;border-radius:20px}
.weekly-card h2{color:#fff;font-size:20px;line-height:1.4;margin:12px 0 6px;position:relative;z-index:1}
.weekly-card p{font-size:12px;color:#fffefc;margin:0 0 17px;position:relative;z-index:1}
.weekly-card .next-week{position:relative;z-index:1;background:linear-gradient(180deg,#fff,#fff0f8);color:#c23e84;border:1px solid white;box-shadow:0 4px 0 #c55c92;font-size:16px;min-height:58px}
.weekly-extra{margin-top:14px;position:relative;z-index:1}
.section-heading{display:flex;gap:11px;align-items:center;margin-bottom:12px}
.section-heading>span{display:grid;place-items:center;width:43px;height:43px;flex:none;border-radius:15px;background:linear-gradient(140deg,#ffe5f2,#f7c5e2);font-size:22px}
.section-heading small{display:block;color:#c17da1;font-size:9px;letter-spacing:.14em;font-weight:900}
.section-heading h2{margin:2px 0 0}
.section-heading h2:before{content:none}
.action-panel .actions{gap:10px}
.action-panel .actions button{display:flex;flex-direction:column;gap:5px;min-height:112px;background:linear-gradient(155deg,#fffefd,#fff1f8);padding:13px 11px}
.action-emoji{font-size:25px;line-height:1.2}
.action-title{font-size:13px;color:#a63f7c}
.action-panel .actions small{margin-top:auto}
.ability-list{display:grid;gap:13px}
.ability-row{background:#fff8fc;border:1px solid #f8dfea;border-radius:15px;padding:11px 12px}
.ability-name{font-size:13px;font-weight:800;color:#8e4c78;display:flex;justify-content:space-between;align-items:center}
.ability-name strong{font-size:17px;color:#d74c91}
.ability-row .bar{height:9px;margin-top:9px}
@media(max-width:390px){.dashboard-hero{min-height:300px}.dashboard-hero .idol-avatar{height:275px;width:230px}.hero-label strong{font-size:16px}.metric strong{font-size:19px}.weekly-card h2{font-size:18px}}
.anime-idol{overflow:visible;filter:drop-shadow(0 8px 13px #aa589255)}
.dashboard-hero .anime-idol{width:270px;height:320px;max-width:90%;transform:translateY(13px)}
.idol-stage .anime-idol{width:235px;max-width:100%;height:auto}
@media(max-width:390px){.dashboard-hero .anime-idol{width:245px;height:295px}}

/* Ver.1.10 featured idol portrait */
.dashboard-hero .featured-idol{position:relative;z-index:2;display:block;width:100%;height:350px;object-fit:cover;object-position:center 35%;filter:drop-shadow(0 6px 12px #ac5a9044)}
.dashboard-hero:has(.featured-idol){min-height:350px;background:#f6d6ec}
.dashboard-hero:has(.featured-idol):before{display:none}
.dashboard-hero:has(.featured-idol) .hero-sparkles{display:none}
.dashboard-hero:has(.featured-idol) .hero-label{bottom:12px}
.portrait-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.portrait-options button{font-size:12px;min-height:48px}
@media(max-width:390px){.dashboard-hero .featured-idol{height:315px}.dashboard-hero:has(.featured-idol){min-height:315px}}

/* Ver.1.10 — full-length anime character showcase */
.dashboard-hero:has(.featured-idol){min-height:520px;background:linear-gradient(180deg,#f6d4ee,#f4b9dd);align-items:stretch}
.dashboard-hero .featured-idol{width:100%;height:520px;object-fit:contain;object-position:center top;filter:none}
.dashboard-hero:has(.featured-idol):after{height:100px;bottom:-60px;z-index:2;pointer-events:none}
.dashboard-hero:has(.featured-idol) .hero-label{z-index:4}
.dashboard-hero:has(.featured-idol) .hero-rank{z-index:4}
@media(max-width:390px){.dashboard-hero:has(.featured-idol){min-height:470px}.dashboard-hero .featured-idol{height:470px}}

/* Ver.1.10 transparent anime character */
.dashboard-hero:has(.featured-idol){background:radial-gradient(ellipse at 50% 34%,#fff4fc 0%,#f6cbe9 42%,#d99ed4 100%)}
.dashboard-hero:has(.featured-idol):before{display:block;opacity:.35}
.dashboard-hero .featured-idol{position:relative;z-index:3;object-fit:contain;object-position:center center}
.dashboard-hero:has(.featured-idol):after{z-index:2}
.dashboard-hero:has(.featured-idol) .hero-label,.dashboard-hero:has(.featured-idol) .hero-rank{z-index:4}

/* Ver.1.10: gentle, GPU-friendly idle animation for the featured character */
.dashboard-hero:has(.featured-idol){isolation:isolate;perspective:900px}
.dashboard-hero .featured-idol{
 transform-origin:50% 75%;
 animation:idol-idle 5.8s ease-in-out infinite;
 will-change:transform,filter;
 filter:drop-shadow(0 12px 10px rgba(122,45,104,.23));
}
.dashboard-hero:has(.featured-idol)::before{
 animation:idol-lights 9s ease-in-out infinite alternate;
}
.dashboard-hero:has(.featured-idol)::after{
 animation:idol-stage-glow 5.8s ease-in-out infinite;
}
@keyframes idol-idle{
 0%,100%{transform:translate3d(0,1px,0) rotate(-.5deg) scale(1);filter:drop-shadow(0 12px 10px rgba(122,45,104,.23))}
 25%{transform:translate3d(2px,-4px,0) rotate(.35deg) scale(1.008)}
 50%{transform:translate3d(0,-8px,0) rotate(.7deg) scale(1.015);filter:drop-shadow(0 17px 15px rgba(122,45,104,.17))}
 75%{transform:translate3d(-2px,-3px,0) rotate(-.25deg) scale(1.006)}
}
@keyframes idol-lights{
 from{opacity:.18;transform:translateX(-9px) rotate(-1deg)}
 to{opacity:.45;transform:translateX(9px) rotate(1deg)}
}
@keyframes idol-stage-glow{
 0%,100%{opacity:.7;transform:translateY(0) scale(1)}
 50%{opacity:1;transform:translateY(3px) scale(1.04)}
}
.dashboard-hero:has(.featured-idol) .hero-rank{animation:idol-badge 3.5s ease-in-out infinite}
@keyframes idol-badge{0%,100%{box-shadow:0 3px 8px #c46a9c55}50%{box-shadow:0 3px 16px #fff9,0 3px 8px #c46a9c55}}
@media(prefers-reduced-motion:reduce){
 .dashboard-hero .featured-idol,
 .dashboard-hero:has(.featured-idol)::before,
 .dashboard-hero:has(.featured-idol)::after,
 .dashboard-hero:has(.featured-idol) .hero-rank{animation:none!important;will-change:auto}
}

/* Ver.1.10: tap reaction, breathing, eyelid blink overlay */
.idol-touch-portrait{height:520px;width:100%;position:relative;z-index:3;display:flex;justify-content:center;align-items:center;cursor:pointer;touch-action:manipulation;outline-offset:-5px}
.idol-touch-portrait .featured-idol{height:100%;width:100%;position:relative;z-index:1;pointer-events:none}
.idol-touch-portrait .idol-blink-layer{position:absolute;height:100%;width:auto;max-width:100%;top:0;left:50%;transform:translateX(-50%);z-index:2;pointer-events:none;overflow:visible}
.blink-lids{opacity:0;animation:idol-blink 6.7s infinite}
.blink-lids path{stroke:#573b48;stroke-width:9;stroke-linecap:round;fill:none}

function groupAlive(g){return g.deadUntil===null}function skillAvg(){return Object.values(s.stats).reduce((a,b)=>a+b,0)/5}function addMental(v){s.mental=clamp(s.mental+v,0,100);if(s.mental<=0)finish('mental')}

function join(g){if(s.ban>0){if(!s.pending.includes(g.name))s.pending.push(g.name);log(`${g.name}の合格資格を保留した（移籍禁止中）`);return}const old=group();if(old&&old.name===g.name)return;const wasIdol=!!old;if(old)closeHistory('移籍');if(wasIdol){s.pop=clamp(s.pop*.8);const diff=['C','B','A','S'].indexOf(g.rank)-['C','B','A','S'].indexOf(old.rank);addMental(diff>0?10:diff<0?-10:0)}else if(!s.firstDebut){addMental(R[g.rank].mental);s.firstDebut=true}g.pop=R[g.rank].initial;s.current=g.name;s.history.push({name:g.name,start:age(),startWeek:s.week,end:null,reason:null});log(`${g.name}へ${wasIdol?'移籍':'加入'}！ ランク${g.rank}`);s.pending=[];save()}

// A single calendar for all regular auditions. Special revival auditions keep their exact dates.
function setupAuditionCalendar(){
 s.audCalendar={half:2,year:6};
 const weeks=Array.from({length:48},(_,i)=>i).filter(w=>w%2===1);
 for(let i=weeks.length-1;i>0;i--){const j=rand(0,i);[weeks[i],weeks[j]]=[weeks[j],weeks[i]]}
 for(let i=0;i<4;i++)s.sEvents[i]=weeks[i];
}
function ensureAuditionCalendar(){
 if(!s.audCalendar||!Number.isInteger(s.audCalendar.half)||!Number.isInteger(s.audCalendar.year)){
  // One-time migration for existing saves: preserves every other game value.
  setupAuditionCalendar();save();

function available(g){if(!groupAlive(g)||s.current===g.name||s.pending.includes(g.name))return false;const t=g.schedule;if(t==='monthly')return s.week%4===0;if(t==='half')return s.week%24===s.audCalendar.half;if(t==='year')return s.week%48===s.audCalendar.year;if(t==='saka')return [12,16,20].includes(age())&&s.week%48===s.sEvents[0];if(t==='forty')return age()>=12&&age()<=19&&s.week%48===s.sEvents[1];if(t==='sashi')return [13,15,17,19].includes(age())&&s.week%48===s.sEvents[2];if(t==='kawaii')return [14,18].includes(age())&&s.week%48===s.sEvents[3];return false}

 {id:'underground',title:'地下アイドルオーディション！',schedules:['half'],rank:'B',desc:'ライブを中心に活動するアイドルを目指そう！'},
 {id:'newgroup',title:'新アイドルグループ結成！',schedules:['year'],rank:'A',desc:'新しいアイドルグループのメンバー募集！'},
 {id:'saka',title:'坂道合同オーディション',schedules:['saka'],rank:'S',desc:'合格後、適性に合わせて配属先が決まります。'},
 {id:'forty',title:'48グループ新メンバー募集',schedules:['forty'],rank:'S',desc:'合格後、48グループの配属先が決まります。'},
 {id:'sashi',title:'指原莉乃プロデュース新グループ結成',schedules:['sashi'],rank:'S',desc:'合格後、プロデュースグループの配属先が決まります。'},
 {id:'kawaii',title:'KAWAII LAB.新グループ結成',schedules:['kawaii'],rank:'S',desc:'合格後、プロジェクト内の配属先が決まります。'}
];
function candidatesFor(type){return s.groups.filter(g=>type.schedules.includes(g.schedule)&&groupAlive(g)&&g.name!==s.current&&!s.pending.includes(g.name))}
function availableForType(type){return candidatesFor(type).filter(g=>available(g)||g.specialWeek===s.week)}
function auditionOpenNames(){return AUD_TYPES.filter(type=>availableForType(type).length).map(type=>type.title)}
function auditionBanner(){const names=auditionOpenNames();return names.length?`<div class="aud-notification" role="status"><div class="aud-notification-title">🔔 オーディション開催中！ <span class="aud-count">${names.length}件</span></div><p>${names.map(esc).join('・')}</p>${btn('🎤 オーディションを確認する',"tab='aud';render()",'primary wide')}</div>`:''}
function choosePlacement(type,gs){
 if(gs.length===1)return gs[0];
 if(type.id==='saka'){
  const best=Math.max(s.stats.face,s.stats.dance,s.stats.sing);
  const preferred=best===s.stats.face?'乃木坂46':best===s.stats.dance?'櫻坂46':'日向坂46';
  return gs.find(g=>g.name===preferred)||gs[rand(0,gs.length-1)];
 }
 return gs[rand(0,gs.length-1)];
}
function audType(id){
 const type=AUD_TYPES.find(x=>x.id===id);
 if(!type||s.done)return;
 const gs=availableForType(type);
 if(!gs.length){notice='このオーディションは今週開催されていません。';render();return}
 const expensive=['A','S'].includes(type.rank);
 if(expensive&&s.actionUsed){notice='今週の自由行動は使用済みです。翌週以降に挑戦してね。';render();return}
 if(expensive)s.actionUsed=true;
 const f=s.stats.face,d=s.stats.dance,v=s.stats.sing;
 const passed=type.rank==='C'?f>=100:type.rank==='B'?f>=200&&Math.max(d,v)>=400:type.rank==='A'?f>=300&&Math.max(d,v)>=500:f>=600&&Math.max(d,v)>=400;
 if(!passed){
  addMental(-5);log(`${type.title}に不合格。メンタル−5`);
  queue.push({title:'📩 オーディション結果：不合格',desc:`「${type.title}」の審査に落選しました。メンタル−5。能力を磨いてまた挑戦しよう！`,options:[['確認する',()=>{}]]});
  save();render();return;
 }
 const g=choosePlacement(type,gs);
 log(`${type.title}に合格！ 配属先は${g.name}に決定！`);
 if(s.ban>0){
  if(!s.pending.includes(g.name))s.pending.push(g.name);
  queue.push({title:'🎉 合格＆配属先決定！',desc:`「${type.title}」に合格！ 配属先は「${g.name}」に決定！ ただし移籍・再デビュー禁止期間中のため、合格資格を保留しました。`,options:[['確認する',()=>{}]]});
  save();render();return;
 }
 queue.push({title:'🎉 合格＆配属先決定！',desc:`「${type.title}」に合格！ あなたの配属先は「${g.name}」に決定しました！ ${s.current?'現在のグループから移籍しますか？':'アイドルデビューしますか？'}`,options:[[s.current?'移籍する':'加入する',()=>join(g)],['辞退する',()=>log(`${g.name}への加入を辞退した`)]]});
 save();render();
}
function doAction(id){if(s.done||s.actionUsed)return;const st=s.stats;if(id==='dance'){st.dance=clamp(st.dance+5);log('ダンスレッスン！ ダンス＋5')}else if(id==='sing'){st.sing=clamp(st.sing+5);log('ボーカルレッスン！ 歌唱力＋5')}else if(id==='humor'){st.humor=clamp(st.humor+5);log('バラエティ番組を研究！ ユーモア＋5')}else if(id==='charm'){st.charm=clamp(st.charm+5);log('笑顔の練習！ 愛嬌＋5')}else if(id==='town'){const cost=rand(1000,5000);if(s.money<5000){notice='街へ出かけるには5,000円以上必要です（費用は1,000〜5,000円）';render();return}s.money-=cost;st.face=clamp(st.face+1);log(`街へお出かけ。${fmt(cost)}円を使い、顔面偏差値＋1`);let chance=st.face>=900?.2:st.face>=700?.1:st.face>=500?.05:st.face>=300?.02:0;if(Math.max(st.dance,st.sing)>=500&&Math.random()<chance){queue.push({title:'✨ スカウトされた！',desc:'「きゅるりと未完成」のスタッフから声をかけられた！',options:[['スカウトを受ける',()=>{let g=s.groups.find(g=>g.name==='きゅるりと未完成');if(s.ban>0){if(!s.pending.includes(g.name))s.pending.push(g.name);log('スカウト加入資格を保留した')}else join(g)}],['断る',()=>log('スカウトを断った')]]})}}else if(id==='help'){s.money+=1000;log('親のお手伝いで1,000円をもらった')}else if(id==='job'){const v=rand(5000,10000);s.money+=v;log(`アルバイトで${fmt(v)}円を稼いだ`)}else if(id==='surgery'){if(s.money<300000){notice='整形には30万円必要です';render();return}s.money-=300000;s.surgeryCount++;let bad=s.surgeryCount>=4&&Math.random()<.5;st.face=clamp(st.face+(bad?-50:100));addMental(-10);s.scandal=clamp(s.scandal+10,0,100);s.scandalKind='surgery';log(`美容整形。顔面偏差値${bad?'−50':'＋100'}、メンタル−10、スキャンダル＋10`)}s.actionUsed=true;save();render()}
function advance(){if(s.done||queue.length)return;const previousAuditions=new Set(auditionOpenNames());notice='';// start of week check before other changes
s.week++;s.actionUsed=false;for(const g of s.groups){if(g.deadUntil!==null&&s.week>=g.deadUntil){g.deadUntil=null;g.rank=g.orig;g.pop=R[g.orig].initial;log(`📰 速報！「${g.name}」が活動再開を発表！`);queue.push({title:'📰 活動再開ニュース',desc:`「${g.name}」が活動再開！ 今週、特別オーディションが開催されます。`,options:[['確認',()=>{}]]});g.specialWeek=s.week}}
if(s.ban>0){s.ban--;if(s.ban===0){let names=[...s.pending];queue.push({title:'🔓 移籍禁止期間が終了しました！',desc:names.length?'保留していた合格資格から加入先を1つ選ぶか、現在の所属を続けられます。':'移籍・再デビューが再び可能になりました。',options:[...names.filter(n=>s.groups.some(g=>g.name===n&&groupAlive(g))).map(n=>[`${n}へ加入`,()=>{const g=s.groups.find(g=>g.name===n);join(g);s.pending=[]}]),['今の状態を続ける',()=>{s.pending=[]}]]})}}
if(isIdol()&&s.scandal>50){let p=s.scandal<=60?.01:s.scandal<90?.05:.10;if(Math.random()<p)applyScandal(s.scandalKind)}if(s.done){render();return}
if(s.week%48===0){s.stats.face=clamp(s.stats.face+(age()<=20?10:0));if(age()<=20)log('お誕生日！ 顔面偏差値＋10')}
if(isIdol()){let g=group();let inc=R[g.rank].base*(1+skillAvg()/1000);s.pop=clamp(s.pop+inc);let pay=R[g.rank].pay*(1+s.pop/500);s.money+=Math.floor(pay);g.pop=clamp(g.pop+R[g.rank].base*(1+s.pop/1000));promotion(g);if(g.pop>=1000&&!g.fullBonus){g.fullBonus=true;s.pop=clamp(s.pop+100);log(`${g.name}が人気1000を達成！ 個人人気＋100`)}let x=Math.random();if(x<.1){addMental(10);log('握手会が大盛況！ メンタル＋10')}else if(x<.2){addMental(5);log('ライブが大成功！ メンタル＋5')}else if(x<.25)log('テレビ出演で注目を集めた！');if(s.partner){s.datingWeeks++;addMental(1);s.scandal=clamp(s.scandal+1,0,100);s.scandalKind='romance';if(s.datingWeeks%48===0){addMental(10);log('交際48週間の記念日！ メンタル＋10')}}else if(age()>=16&&Math.random()<.05){let first=['佐藤','田中','高橋','山本','伊藤','中村','小林','加藤'],last=['悠真','蓮','大翔','颯太','湊','樹','陽翔'];let person={id:s.week+'-'+rand(100,999),name:first[rand(0,7)]+' '+last[rand(0,6)],startAge:age()+rand(-2,2)};queue.push({title:'💌 男性アイドルからの告白',desc:`${person.name}（${person.startAge}歳）から交際を申し込まれた！`,options:[['交際する',()=>{s.partner=person;s.datingWeeks=0;log(`${person.name}と交際を始めた！`)}],['断る',()=>log('交際を断った')]]})}}else{if(s.firstDebut)s.pop=clamp(s.pop-1);if(s.scandal>0)s.scandal--;if(!s.firstDebut&&age()>=25)finish('age25')}
if(isIdol()&&!s.partner&&s.scandal>0)s.scandal--;
if(age()>=30)finish('age30');
if(!s.done){
 const newlyOpened=auditionOpenNames().filter(n=>!previousAuditions.has(n));
 if(newlyOpened.length){
  log(`🔔 オーディション開催！ ${newlyOpened.join('、')}`);
  queue.push({title:'🔔 オーディション開催のお知らせ！',desc:`今週は「${newlyOpened.join('」「')}」のオーディションが開催されます！ 能力値に関係なく受験できます。`,options:[['🎤 オーディションを見に行く',()=>{tab='aud'}],['あとで確認する',()=>{}]]});
 }
}
save();render()}
function dismiss(i){let e=queue.shift();if(e&&e.options[i])e.options[i][1]();save();render()}
function btn(text,fn,cls=''){return `<button class="${esc(cls)}" onclick="${esc(fn)}">${text}</button>`}function bar(v,max=1000){return `<div class="bar"><i style="width:${Math.min(100,Math.max(0,v/max*100))}%"></i></div>`}

 const acts=[['dance','💃','ダンスレッスン','ダンス＋5'],['sing','🎤','ボーカルレッスン','歌唱力＋5'],['charm','😊','笑顔の練習','愛嬌＋5'],['humor','📺','バラエティ研究','ユーモア＋5'],['town','🛍️','街へ出かける','費用1,000〜5,000円／顔面＋1／スカウト'],...(age()<=18?[['help','🏠','親のお手伝い','＋1,000円']]:[]),...(age()>=16?[['job','💼','アルバイト','＋5,000〜10,000円']]:[]),['surgery','💎','美容整形','30万円／顔面＋100（4回目以降リスク）']];

function decline(n){s.pending=s.pending.filter(x=>x!==n);log(`${n}の合格資格を辞退した`);save();render()}
function groupsPanel(){return `<div class="panel"><h2>🏢 アイドルグループ一覧</h2><p class="muted">解散中のグループは非表示。他グループの人気数値は非表示です。</p>${s.groups.filter(groupAlive).map(g=>`<div class="group"><strong>${esc(g.name)}</strong> <span class="pill">${g.rank}ランク</span>${g.name===s.current?`<div class="muted">所属中／人気${fmt(g.pop)}</div>`:''}</div>`).join('')}</div>`}
function historyPanel(){return `<div class="panel"><h2>📖 アイドル活動履歴</h2>${s.history.length?s.history.map((h,i)=>`<div class="group"><strong>${i+1}. ${esc(h.name)}</strong><div class="muted">加入：${h.start}歳（通算${h.startWeek}週） ／ 脱退：${h.end===null?'現在所属中':h.end+'歳（通算'+h.endWeek+'週）'} ／ 理由：${esc(h.reason||'活動中')}</div></div>`).join(''):'<p class="muted">まだ所属履歴がありません。</p>'}</div><div class="panel"><h2>📰 活動の記録</h2>${s.logs.slice(0,35).map(x=>`<div class="log">${esc(x)}</div>`).join('')}</div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.body.classList.remove('compact-home');document.body.classList.toggle('game-home',!!s&&!s.done&&!queue.length&&tab==='home');if(!s){$('app').innerHTML=`<div class="panel"><h2>🌟 新しいアイドル人生を始めよう！</h2><p>12歳の少女として、トップアイドルを目指そう。</p><div class="idol-stage" id="create-preview">${avatar(LOOK_DEFAULT)}<span class="idol-tag">MY IDOL</span><span class="idol-caption">あなただけのアイドルを作ろう ♡</span></div><label>主人公の名前<input id="name" placeholder="例：星野 ひかり" maxlength="25"></label>${lookControls(LOOK_DEFAULT,'create')}<p class="look-note">あとから「着せ替え」メニューで何度でも変更できます。</p>${btn('この子でゲームスタート ♡','startNew()','primary wide')}${localStorage.getItem(KEY)?`<p>${btn('前回の続きから遊ぶ','load()','wide')}</p>`:''}</div>`;return}if(s.done){$('app').innerHTML=headerStats()+`<div class="panel end"><h2>🏆 アイドル人生の結末</h2><h1>${s.result==='夢は叶わなかった。来世に期待'?'引退':rankGrade()+'ランク'}</h1><p>${esc(s.result)}</p><p>最終個人人気：${fmt(s.pop)} / 1000</p><p class="muted">所属履歴はこの下に表示しています。</p><p>${btn('新しい人生を始める','resetGame()','primary wide')}</p></div>`+historyPanel();return}if(queue.length){let q=queue[0];$('app').innerHTML=headerStats()+`<div class="panel"><h2>${esc(q.title)}</h2><p>${esc(q.desc)}</p><div class="choices">${q.options.map(([label],i)=>btn(esc(label),`dismiss(${i})`,i===0?'primary':'')).join('')}</div></div>`;return}if(tab==='home'){$('app').innerHTML=gameHome();return;}$('app').innerHTML=headerStats()+(notice?`<div class="alert">${esc(notice)}</div>`:'')+`<div class="tabs">${[['home','🏠 ホーム'],['actions','👟 行動'],['stats','✨ 能力'],['aud',auditionOpenNames().length?'🎟️ オーディション 🔴':'🎟️ オーディション'],['groups','🏢 グループ'],['history','📖 履歴'],['look','🎀 着せ替え']].map(([id,name])=>btn(name,`tab='${id}';render()`,tab===id?'active':'')).join('')}</div>`+({home:home,actions:actionScreen,stats:statsScreen,aud:auditionPanel,groups:groupsPanel,history:historyPanel,look:wardrobe}[tab]())+`<div class="panel"><details><summary>💾 セーブ・やり直し</summary><p class="muted">毎回自動保存されます。同じブラウザで続きから遊べます。</p>${btn('最初からやり直す','resetGame()')}</details></div>`}
function resetGame(){if(confirm('現在のセーブデータを消して最初から始めますか？')){localStorage.removeItem(KEY);s=null;queue=[];tab='home';render()}}function load(){try{s=JSON.parse(localStorage.getItem(KEY));if(!s||!s.groups)throw Error();queue=[];ensureAuditionCalendar();render()}catch(e){alert('セーブデータを読み込めませんでした')}}
document.addEventListener('click',function(event){
 const button=event.target.closest('button[data-aud-type]');
 if(!button)return;
 event.preventDefault();
 audType(button.getAttribute('data-aud-type'));
});
render();</script></body></html>
