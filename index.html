function portrait(x){
 return s&&s.portraitMode==='custom'?avatar(x):`<img class="featured-idol" src="${FEATURED_IDOL_IMAGE}" alt="ピンクのアイドル衣装でステージに立つアニメ調の主人公" draggable="false">`;
}
function choosePortraitMode(mode){
 if(!s)return;
 s.portraitMode=mode==='custom'?'custom':'illustration';
 save();render();
}
function lookControls(v,prefix){
 const c=lookOf(v);
 const fields=[['hair','髪色',[['brown','ブラウン'],['black','ブラック'],['blonde','ブロンド'],['pink','ピンク'],['silver','シルバー']]],
 ['style','髪型',[['long','ロング'],['short','ショート'],['twintail','ツインテール']]],
 ['eyes','瞳の色',[['brown','ブラウン'],['blue','ブルー'],['green','グリーン'],['purple','パープル']]],
 ['ribbon','リボン',[['pink','ピンク'],['red','レッド'],['lavender','ラベンダー'],['blue','ブルー']]]];
 return `<div class="look-controls">${fields.map(([k,title,opts])=>`<label>${title}<select id="${prefix}-${k}" onchange="previewLook('${prefix}')">${opts.map(([id,name])=>`<option value="${id}" ${c[k]===id?'selected':''}>${name}</option>`).join('')}</select></label>`).join('')}</div>`;
}
function selectedLook(prefix){let x={};for(let k of ['hair','style','eyes','ribbon'])x[k]=$(prefix+'-'+k)?.value||LOOK_DEFAULT[k];return x}
function previewLook(prefix){let el=$(prefix+'-preview');if(el)el.innerHTML=avatar(selectedLook(prefix))}
function startNew(){init($('name').value.trim(),selectedLook('create'))}
function updateLook(){s.look=selectedLook('wardrobe');save();render()}
function wardrobe(){return `<div class="panel"><h2>🎀 主人公の表示スタイル</h2><p class="muted">ホーム画面の主人公を切り替えられます。新しいアニメイラストは固定画像のため、髪型・髪色・瞳・リボンの変更は「カスタム立ち絵」に反映されます。</p><div class="portrait-options">${btn('✨ 本格アニメイラスト', "choosePortraitMode('illustration')",s.portraitMode!=='custom'?'primary':'')}${btn('🎨 カスタム立ち絵', "choosePortraitMode('custom')",s.portraitMode==='custom'?'primary':'')}</div></div><div class="panel"><h2>🎀 アイドルの着せ替え</h2><p class="muted">髪型・髪色・瞳・リボンをいつでも変更できます。能力値には影響しません。</p><div class="idol-stage" id="wardrobe-preview">${portrait(s.look)}</div>${lookControls(s.look,'wardrobe')}${btn('この見た目にする','updateLook()','primary wide')}</div>`}
function init(name,look){s={look:lookOf(look),name:name||'アイドル候補生',week:0,money:0,mental:rand(50,100),pop:0,stats:{face:rand(50,800),charm:rand(100,500),dance:100,sing:rand(100,500),humor:rand(100,500)},groups:defs.map(([name,orig,schedule])=>({name,orig,rank:orig,schedule,pop:R[orig].initial,deadUntil:null,fullBonus:false,highest:orig})),current:null,history:[],firstDebut:false,scandal:0,scandalKind:'romance',ban:0,pending:[],exposures:0,romanceExposures:0,apologized:[],partner:null,datingWeeks:0,actionUsed:false,done:false,result:'',surgeryCount:0,offers:[],scout:null,events:[],sEvents:{},logs:[]};setupAuditionCalendar();log('テレビで輝くアイドルを見て、アイドルになる夢を抱いた！');save();render()}
function groupAlive(g){return g.deadUntil===null}function skillAvg(){return Object.values(s.stats).reduce((a,b)=>a+b,0)/5}function addMental(v){s.mental=clamp(s.mental+v,0,100);if(s.mental<=0)finish('mental')}
function closeHistory(reason){const h=s.history.at(-1);if(h&&!h.end){h.end=age();h.endWeek=s.week;h.reason=reason}}
function join(g){if(s.ban>0){if(!s.pending.includes(g.name))s.pending.push(g.name);log(`${g.name}の合格資格を保留した（移籍禁止中）`);return}const old=group();if(old&&old.name===g.name)return;const wasIdol=!!old;if(old)closeHistory('移籍');if(wasIdol){s.pop=clamp(s.pop*.8);const diff=['C','B','A','S'].indexOf(g.rank)-['C','B','A','S'].indexOf(old.rank);addMental(diff>0?10:diff<0?-10:0)}else if(!s.firstDebut){addMental(R[g.rank].mental);s.firstDebut=true}g.pop=R[g.rank].initial;s.current=g.name;s.history.push({name:g.name,start:age(),startWeek:s.week,end:null,reason:null});log(`${g.name}へ${wasIdol?'移籍':'加入'}！ ランク${g.rank}`);s.pending=[];save()}
function graduate(){if(!isIdol())return;closeHistory('卒業');log(`${s.current}を卒業した。一般人として新しい道へ。`);s.current=null;s.partner=null;s.datingWeeks=0;s.scandal=0;queue.push({title:'🎓 グループを卒業しました',desc:'ここで人生の結果を見るか、一般人として再デビューを目指すか選べます。',options:[['結果を見て終了',()=>finish('graduate')],['一般人として続ける',()=>{}]]});save();render()}
function disband(g){g.deadUntil=s.week+48;g.pop=0;log(`速報！ ${g.name}が解散した！`);if(s.current===g.name){closeHistory('グループ解散');s.current=null;s.partner=null;s.datingWeeks=0;s.scandal=0;addMental(-10);queue.push({title:'💔 グループ解散',desc:`${g.name}が解散。一般人に戻りました。メンタル−10。`,options:[['確認',()=>{}]]})}}
function promotion(g){if(g.rank==='C'&&g.pop>=300){g.rank='B';addMental(5);log(`${g.name}がBランクに昇格！ メンタル＋5`)}else if(g.rank==='B'&&g.pop>=500){g.rank='A';addMental(10);log(`${g.name}がAランクに昇格！ メンタル＋10`)}else if(g.rank==='A'&&g.pop>=800){g.rank='S';addMental(20);log(`${g.name}がSランクに昇格！ メンタル＋20`)}}

function auditionPanel(){
 const open=AUD_TYPES.filter(type=>availableForType(type).length);
 return `<div class="panel"><h2>🎟️ オーディション</h2><p class="muted">能力値に関係なく受験できます。合格基準と配属先は審査結果が出るまで非公開です。開催週のみ応募可能。ローカル・地下は自由行動を消費せず、その他は消費します。</p>${open.map(type=>`<div class="group"><strong>${esc(type.title)}</strong> <span class="pill">${type.rank}ランク</span>${availableForType(type).some(g=>g.specialWeek===s.week)?'<span class="pill">特別開催</span>':''}<p class="muted">${esc(type.desc)}</p><div style="margin-top:8px"><button type="button" class="primary" data-aud-type="${esc(type.id)}">🎤 受験する</button></div></div>`).join('')||'<p>今週受験できるオーディションはありません。</p>'}<details><summary>オーディション開催周期</summary>${AUD_TYPES.map(type=>`<div class="group">${esc(type.title)} <span class="muted">${{local:'4週ごと',underground:'24週ごと（重複回避）',newgroup:'48週ごと（重複回避）',saka:'12・16・20歳のランダム週',forty:'12〜19歳のランダム週',sashi:'13・15・17・19歳のランダム週',kawaii:'14・18歳のランダム週'}[type.id]}</span></div>`).join('')}</details></div>${s.pending.length?`<div class="panel"><h2>📩 保留中の合格資格</h2>${s.pending.map(n=>`<div class="group">${esc(n)} ${btn('辞退する',`decline(${JSON.stringify(n)})`)}</div>`).join('')}</div>`:''}`
}
function decline(n){s.pending=s.pending.filter(x=>x!==n);log(`${n}の合格資格を辞退した`);save();render()}
function groupsPanel(){return `<div class="panel"><h2>🏢 アイドルグループ一覧</h2><p class="muted">解散中のグループは非表示。他グループの人気数値は非表示です。</p>${s.groups.filter(groupAlive).map(g=>`<div class="group"><strong>${esc(g.name)}</strong> <span class="pill">${g.rank}ランク</span>${g.name===s.current?`<div class="muted">所属中／人気${fmt(g.pop)}</div>`:''}</div>`).join('')}</div>`}
function historyPanel(){return `<div class="panel"><h2>📖 アイドル活動履歴</h2>${s.history.length?s.history.map((h,i)=>`<div class="group"><strong>${i+1}. ${esc(h.name)}</strong><div class="muted">加入：${h.start}歳（通算${h.startWeek}週） ／ 脱退：${h.end===null?'現在所属中':h.end+'歳（通算'+h.endWeek+'週）'} ／ 理由：${esc(h.reason||'活動中')}</div></div>`).join(''):'<p class="muted">まだ所属履歴がありません。</p>'}</div><div class="panel"><h2>📰 活動の記録</h2>${s.logs.slice(0,35).map(x=>`<div class="log">${esc(x)}</div>`).join('')}</div>`}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!s){$('app').innerHTML=`<div class="panel"><h2>🌟 新しいアイドル人生を始めよう！</h2><p>12歳の少女として、トップアイドルを目指そう。</p><div class="idol-stage" id="create-preview">${avatar(LOOK_DEFAULT)}<span class="idol-tag">MY IDOL</span><span class="idol-caption">あなただけのアイドルを作ろう ♡</span></div><label>主人公の名前<input id="name" placeholder="例：星野 ひかり" maxlength="25"></label>${lookControls(LOOK_DEFAULT,'create')}<p class="look-note">あとから「着せ替え」メニューで何度でも変更できます。</p>${btn('この子でゲームスタート ♡','startNew()','primary wide')}${localStorage.getItem(KEY)?`<p>${btn('前回の続きから遊ぶ','load()','wide')}</p>`:''}</div>`;return}if(s.done){$('app').innerHTML=headerStats()+`<div class="panel end"><h2>🏆 アイドル人生の結末</h2><h1>${s.result==='夢は叶わなかった。来世に期待'?'引退':rankGrade()+'ランク'}</h1><p>${esc(s.result)}</p><p>最終個人人気：${fmt(s.pop)} / 1000</p><p class="muted">所属履歴はこの下に表示しています。</p><p>${btn('新しい人生を始める','resetGame()','primary wide')}</p></div>`+historyPanel();return}if(queue.length){let q=queue[0];$('app').innerHTML=headerStats()+`<div class="panel"><h2>${esc(q.title)}</h2><p>${esc(q.desc)}</p><div class="choices">${q.options.map(([label],i)=>btn(esc(label),`dismiss(${i})`,i===0?'primary':'')).join('')}</div></div>`;return}$('app').innerHTML=headerStats()+(notice?`<div class="alert">${esc(notice)}</div>`:'')+`<div class="tabs">${[['home','🏠 ホーム'],['aud',auditionOpenNames().length?'🎟️ オーディション 🔴':'🎟️ オーディション'],['groups','🏢 グループ'],['history','📖 履歴'],['look','🎀 着せ替え']].map(([id,name])=>btn(name,`tab='${id}';render()`,tab===id?'active':'')).join('')}</div>`+({home:home,aud:auditionPanel,groups:groupsPanel,history:historyPanel,look:wardrobe}[tab]())+`<div class="panel"><details><summary>💾 セーブ・やり直し</summary><p class="muted">毎回自動保存されます。同じブラウザで続きから遊べます。</p>${btn('最初からやり直す','resetGame()')}</details></div>`}
function resetGame(){if(confirm('現在のセーブデータを消して最初から始めますか？')){localStorage.removeItem(KEY);s=null;queue=[];tab='home';render()}}function load(){try{s=JSON.parse(localStorage.getItem(KEY));if(!s||!s.groups)throw Error();queue=[];ensureAuditionCalendar();render()}catch(e){alert('セーブデータを読み込めませんでした')}}
document.addEventListener('click',function(event){
 const button=event.target.closest('button[data-aud-type]');
 if(!button)return;
 event.preventDefault();
 audType(button.getAttribute('data-aud-type'));
});
render();</script></body></html>
